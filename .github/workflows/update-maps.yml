name: Update star maps

on:
  schedule:
    - cron: "17 4 * * 1" # weekly, Mondays 04:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "stargazer_map/**"
      - "pyproject.toml"
      - ".github/workflows/update-maps.yml"

permissions:
  contents: write 
  pages: write
  id-token: write

concurrency:
  group: star-maps
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install .

      - name: Fetch stargazers and geocode locations
        env:
          # GitHub only lets admins/collaborators list stargazers (since July 2026),
          # so the default GITHUB_TOKEN is not enough. See README > "Token".
          GH_TOKEN: ${{ secrets.STARGAZERS_TOKEN }}
          ORG: ${{ github.repository_owner }} 
          INCLUDE_FORKS: "false"
          INCLUDE_ARCHIVED: "true"
          INCLUDE_LOGINS: "false"
          MAX_GEOCODE: "800"
        run: stargazer-map fetch

      - name: Commit refreshed data
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The fetch can take a while, and main may have moved meanwhile (a push, a fork
          # sync). Put the fresh data/ on top of the latest main instead of failing the push.
          cp -r data "$RUNNER_TEMP/data"
          for attempt in 1 2 3; do
            git fetch --quiet origin "$GITHUB_REF_NAME"
            git reset --quiet --hard FETCH_HEAD
            rm -rf data && cp -r "$RUNNER_TEMP/data" data
            git add -A data/
            if git diff --cached --quiet; then
              echo "No data changes."
              exit 0
            fi
            git commit --quiet -m "chore: refresh star maps $(date -u +%F)"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push rejected (attempt $attempt/3), retrying on the latest $GITHUB_REF_NAME."
            sleep $((attempt * 5))
          done
          exit 1

      - name: Build site
        env:
          # Map layers shown when a page opens: countries, bubbles, or both.
          # Viewers can toggle each one on the map.
          MAP_LAYERS: "countries,bubbles"
        run: stargazer-map build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
